 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Defender - Cost Tracker (Light)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Light theme custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        textarea { resize: vertical; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-200 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    Digital Defender Cost Tracker
                </h1>
                <p class="text-sm text-gray-500 mt-1">Live OpenRouter & NearAI estimation • Light Edition</p>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Column: Inputs & Controls -->
            <div class="lg:col-span-8 space-y-4">
                
                <!-- Controls Card -->
                <div class="bg-white border border-gray-200 shadow-sm rounded-lg p-5 space-y-5">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Model Selection -->
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-600 uppercase tracking-wider block">Model</label>
                            <select id="model-select" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-mono transition-colors">
                                <optgroup label="Work (Reasoning/High-end)">
                                    <option value="DeepSeek V4 Pro (OpenRouter)">DeepSeek V4 Pro (OR) - $0.10 / $8.00</option>
                                    <option value="Claude Fable 5.2 (NearAI)">Claude Fable 5.2 (NearAI) - $8.00 / $40.00</option>
                                    <option value="GPT-4.1 (NearAI)">GPT-4.1 (NearAI) - $2.00 / $8.00</option>
                                    <option value="DeepSeek V4 Pro 0423 (OpenRouter)">DeepSeek V4 Pro 0423 (OR) - $0.894 / $1.788</option>
                                    <option value="Claude Sonnet 5 (OpenRouter)">Claude Sonnet 5 (OR) - $2.00 / $10.00</option>
                                </optgroup>
                                <optgroup label="Casual (Fast/Low-cost)">
                                    <option value="DeepSeek V4.1 Flash 1017 (NearAI)">DS V4.1 Flash 1017 (NearAI) - $0.30 / $1.20</option>
                                    <option value="Claude Haiku 5.5 (NearAI)">Claude Haiku 5.5 (NearAI) - $0.10 / $0.50</option>
                                    <option value="Qwen 3.8 27B (NearAI)">Qwen 3.8 27B (NearAI) - $0.04 / $1.35</option>
                                    <option value="DeepSeek V4 Flash (OpenRouter)">DeepSeek V4 Flash (OR) - $0.065 / $0.180</option>
                                    <option value="GPT-4.1 mini (NearAI)">GPT-4.1 mini (NearAI) - $0.40 / $1.60</option>
                                </optgroup>
                            </select>
                        </div>
                        
                        <!-- INR Rate -->
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-600 uppercase tracking-wider block">USD to INR Rate (₹)</label>
                            <input type="number" id="inr-rate" value="84.00" step="0.10" class="w-full bg-white border border-gray-300 rounded p-2.5 text-sm text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-mono transition-colors">
                        </div>
                    </div>

                    <!-- Modifiers -->
                    <div class="flex flex-wrap gap-x-6 gap-y-3 pt-4 border-t border-gray-100">
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-700 hover:text-gray-900 select-none">
                            <input type="checkbox" id="mod-dense" class="rounded bg-white border-gray-300 text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer">
                            Dense Log/Code (~2.8 chars/token instead of ~4)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-gray-700 hover:text-gray-900 select-none">
                            <input type="checkbox" id="mod-context" class="rounded bg-white border-gray-300 text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer">
                            Multi-turn context (x1.3 Input Tokens)
                        </label>
                    </div>
                </div>

                <!-- Text Areas -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-600 uppercase tracking-wider block mb-1">Input Prompt</label>
                        <textarea id="input-text" rows="10" placeholder="Type or paste your prompt here. Costs calculate automatically..." class="w-full bg-white border border-gray-300 shadow-sm rounded-lg p-3 text-sm font-mono text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors placeholder:text-gray-400"></textarea>
                    </div>
                    
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-600 uppercase tracking-wider block mb-1">Output Response</label>
                        <textarea id="output-text" rows="10" placeholder="Type or paste the response here. Costs calculate automatically..." class="w-full bg-white border border-gray-300 shadow-sm rounded-lg p-3 text-sm font-mono text-gray-800 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors placeholder:text-gray-400"></textarea>
                    </div>
                </div>

            </div>

            <!-- Right Column: Live Stats & Actions -->
            <div class="lg:col-span-4 space-y-4">
                
                <div class="bg-white border border-gray-200 shadow-sm rounded-lg p-5 sticky top-6">
                    <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider mb-4 border-b border-gray-100 pb-2">Estimated Cost</h2>
                    
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                            <span class="text-sm text-gray-600 font-medium">Input Tokens</span>
                            <span id="res-in-tokens" class="font-mono text-gray-800 font-medium">0</span>
                        </div>
                        <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                            <span class="text-sm text-gray-600 font-medium">Output Tokens</span>
                            <span id="res-out-tokens" class="font-mono text-gray-800 font-medium">0</span>
                        </div>
                        <div class="flex justify-between items-center p-2">
                            <span class="text-sm text-gray-600 font-bold">Cost (USD)</span>
                            <span id="res-usd" class="font-mono text-xl font-bold text-blue-700">$0.000000</span>
                        </div>
                        <div class="flex justify-between items-center p-2 border-t border-gray-100 bg-green-50/50 rounded-b">
                            <span class="text-sm text-gray-700 font-bold">Cost (INR)</span>
                            <span id="res-inr" class="font-mono text-xl font-bold text-green-700">₹0.00</span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <button id="btn-add-log" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded shadow transition-colors flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Add to Log
                        </button>
                    </div>
                </div>

            </div>
        </main>

        <!-- Dashboard / Log Table -->
        <section class="bg-white border border-gray-200 shadow-sm rounded-lg overflow-hidden mt-8">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider">Usage Dashboard</h2>
                <div class="flex gap-2">
                    <button id="btn-export" class="px-3 py-1.5 text-xs font-medium text-gray-700 bg-white hover:bg-gray-50 rounded border border-gray-300 shadow-sm transition-colors">Export CSV</button>
                    <button id="btn-clear" class="px-3 py-1.5 text-xs font-medium text-red-600 bg-white hover:bg-red-50 rounded border border-gray-300 shadow-sm transition-colors">Clear Log</button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-xs font-bold text-gray-600 bg-white uppercase">
                            <th class="p-4">Date</th>
                            <th class="p-4">Model</th>
                            <th class="p-4">Settings</th>
                            <th class="p-4">Tokens (In/Out)</th>
                            <th class="p-4 text-right">Cost (USD)</th>
                            <th class="p-4 text-right">Cost (INR)</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body" class="text-sm text-gray-800 font-mono divide-y divide-gray-100">
                        <!-- Rows dynamically populated -->
                    </tbody>
                    <tfoot class="border-t-2 border-gray-200 bg-gray-50 text-gray-900 font-bold text-sm font-mono">
                        <tr>
                            <td colspan="3" class="p-4 text-right uppercase text-xs tracking-wider">Grand Total:</td>
                            <td id="total-tokens-tfoot" class="p-4">0 / 0</td>
                            <td id="total-usd-tfoot" class="p-4 text-right text-blue-700">$0.000000</td>
                            <td id="total-inr-tfoot" class="p-4 text-right text-green-700">₹0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

    </div>

    <script>
        // Specific user-requested models
        const MODEL_RATES = {
            // Work
            "DeepSeek V4 Pro (OpenRouter)": { in: 0.10, out: 8.00 },
            "Claude Fable 5.2 (NearAI)": { in: 8.00, out: 40.00 },
            "GPT-4.1 (NearAI)": { in: 2.00, out: 8.00 },
            "DeepSeek V4 Pro 0423 (OpenRouter)": { in: 0.894, out: 1.788 },
            "Claude Sonnet 5 (OpenRouter)": { in: 2.00, out: 10.00 },
            // Casual
            "DeepSeek V4.1 Flash 1017 (NearAI)": { in: 0.30, out: 1.20 },
            "Claude Haiku 5.5 (NearAI)": { in: 0.10, out: 0.50 },
            "Qwen 3.8 27B (NearAI)": { in: 0.04, out: 1.35 },
            "DeepSeek V4 Flash (OpenRouter)": { in: 0.065, out: 0.180 },
            "GPT-4.1 mini (NearAI)": { in: 0.40, out: 1.60 }
        };

        // State
        let logs = JSON.parse(localStorage.getItem('ddTrackerLightLogsV2') || '[]');
        let currentCalc = { inTokens: 0, outTokens: 0, usd: 0, inr: 0, modelName: '', settingsLabel: '' };

        // DOM Elements
        const elSelect = document.getElementById('model-select');
        const elInrRate = document.getElementById('inr-rate');
        const elInput = document.getElementById('input-text');
        const elOutput = document.getElementById('output-text');
        const elModDense = document.getElementById('mod-dense');
        const elModContext = document.getElementById('mod-context');
        
        const elResIn = document.getElementById('res-in-tokens');
        const elResOut = document.getElementById('res-out-tokens');
        const elResUsd = document.getElementById('res-usd');
        const elResInr = document.getElementById('res-inr');
        
        const elTableBody = document.getElementById('log-table-body');
        
        // Core Calculation Engine (Runs automatically)
        function calculate() {
            const modelName = elSelect.value;
            const rates = MODEL_RATES[modelName];
            const inrRate = parseFloat(elInrRate.value) || 0;
            
            // Determine characters per token (Density modifier)
            const isDense = elModDense.checked;
            const charsPerToken = isDense ? 2.8 : 4.0;
            const densityLabel = isDense ? 'Dense(2.8)' : 'Prose(4.0)';
            
            // Multi-turn modifier
            const isMultiTurn = elModContext.checked;
            const contextLabel = isMultiTurn ? 'Multi-turn' : 'Single-shot';
            const settingsLabel = `${densityLabel} • ${contextLabel}`;
            
            // Estimate raw tokens
            const inTextLen = elInput.value.length;
            const outTextLen = elOutput.value.length;
            
            let inTokens = inTextLen > 0 ? Math.ceil(inTextLen / charsPerToken) : 0;
            let outTokens = outTextLen > 0 ? Math.ceil(outTextLen / charsPerToken) : 0;
            
            // Apply Multi-turn Modifier (x1.3 on input tokens)
            if (isMultiTurn) {
                inTokens = Math.ceil(inTokens * 1.3);
            }
            
            // Cost calculation (no platform fee)
            let usdCost = 0;
            if (rates) {
                usdCost = (inTokens / 1000000 * rates.in) + (outTokens / 1000000 * rates.out);
            }

            const inrCost = usdCost * inrRate;

            // Update State for logging
            currentCalc = {
                inTokens,
                outTokens,
                usd: usdCost,
                inr: inrCost,
                modelName: modelName,
                settingsLabel: settingsLabel
            };

            // Update UI
            elResIn.textContent = inTokens.toLocaleString();
            elResOut.textContent = outTokens.toLocaleString();
            elResUsd.textContent = `$${usdCost.toFixed(6)}`;
            elResInr.textContent = `₹${inrCost.toFixed(2)}`;
        }

        // Logging Functions
        function addLog() {
            if (currentCalc.inTokens === 0 && currentCalc.outTokens === 0) {
                return; // Silently ignore empty submissions
            }

            const entry = {
                id: Date.now(),
                date: new Date().toISOString(),
                model: currentCalc.modelName,
                settingsLabel: currentCalc.settingsLabel,
                inTokens: currentCalc.inTokens,
                outTokens: currentCalc.outTokens,
                usd: currentCalc.usd,
                inr: currentCalc.inr
            };

            logs.push(entry);
            localStorage.setItem('ddTrackerLightLogsV2', JSON.stringify(logs));
            
            renderLogs();

            // Clear inputs for the next entry
            elInput.value = '';
            elOutput.value = '';
            calculate(); // Reset calculation UI to 0

            // Visual feedback on button
            const btn = document.getElementById('btn-add-log');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Saved!`;
            btn.classList.add('bg-green-600', 'hover:bg-green-700');
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            }, 1200);
        }

        function renderLogs() {
            elTableBody.innerHTML = '';
            
            if (logs.length === 0) {
                elTableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500 font-sans">No history logged yet.</td></tr>`;
                document.getElementById('total-tokens-tfoot').textContent = '0 / 0';
                document.getElementById('total-usd-tfoot').textContent = '$0.000000';
                document.getElementById('total-inr-tfoot').textContent = '₹0.00';
                return;
            }

            const sortedLogs = [...logs].reverse(); // newest first
            let sumIn = 0, sumOut = 0, sumUsd = 0, sumInr = 0;

            sortedLogs.forEach(log => {
                sumIn += log.inTokens;
                sumOut += log.outTokens;
                sumUsd += log.usd;
                sumInr += log.inr;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition-colors';
                
                const d = new Date(log.date);
                const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                tr.innerHTML = `
                    <td class="p-4 text-gray-500 text-xs">${dateStr}</td>
                    <td class="p-4 font-semibold text-gray-700">${log.model}</td>
                    <td class="p-4 text-gray-500 text-xs">${log.settingsLabel}</td>
                    <td class="p-4">${log.inTokens.toLocaleString()} / ${log.outTokens.toLocaleString()}</td>
                    <td class="p-4 text-right text-blue-600">$${log.usd.toFixed(6)}</td>
                    <td class="p-4 text-right text-green-600 font-medium">₹${log.inr.toFixed(2)}</td>
                `;
                elTableBody.appendChild(tr);
            });

            document.getElementById('total-tokens-tfoot').textContent = `${sumIn.toLocaleString()} / ${sumOut.toLocaleString()}`;
            document.getElementById('total-usd-tfoot').textContent = `$${sumUsd.toFixed(6)}`;
            document.getElementById('total-inr-tfoot').textContent = `₹${sumInr.toFixed(2)}`;
        }

        function clearLogs() {
            if(confirm('Are you sure you want to delete all saved calculations?')) {
                logs = [];
                localStorage.removeItem('ddTrackerLightLogsV2');
                renderLogs();
            }
        }

        function exportCSV() {
            if (logs.length === 0) return alert('No data to export.');

            let csv = 'Date,Model,Settings,Input Tokens,Output Tokens,Cost (USD),Cost (INR)\n';
            logs.forEach(log => {
                const date = new Date(log.date).toISOString().replace(/T/, ' ').replace(/\..+/, '');
                const model = `"${log.model.replace(/"/g, '""')}"`;
                csv += `${date},${model},${log.settingsLabel},${log.inTokens},${log.outTokens},${log.usd.toFixed(6)},${log.inr.toFixed(2)}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `AI_Cost_Logs_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Init and Auto-Calculate Listeners
        window.onload = () => {
            renderLogs();
            calculate(); // initial zero state
            
            // Add To Log button listener
            document.getElementById('btn-add-log').addEventListener('click', addLog);
            
            // Dashboard listeners
            document.getElementById('btn-clear').addEventListener('click', clearLogs);
            document.getElementById('btn-export').addEventListener('click', exportCSV);

            // Auto-calculate on any change
            const triggers = [elInput, elOutput, elSelect, elInrRate, elModDense, elModContext];
            triggers.forEach(el => {
                el.addEventListener('input', calculate);
                el.addEventListener('change', calculate);
            });
        };
    </script>
</body>
</html>
